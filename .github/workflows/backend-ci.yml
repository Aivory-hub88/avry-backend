name: backend-ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app/main.py && python -m py_compile app/services/tiers.py && python -m py_compile app/services/guarded_fetch.py

      - name: Tests
        # The app refuses to import without JWT_SECRET (fail-closed); any non-placeholder value works here.
        env:
          JWT_SECRET: ci-only-test-secret
        run: python -m unittest discover -s tests -v
